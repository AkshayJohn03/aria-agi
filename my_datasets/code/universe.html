<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neuro-Cellular AGI Visualization</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: monospace;
            pointer-events: none;
            z-index: 100;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="info">Neuro-Cellular Interface <br> Click & Drag to Interact</div>
    
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 5, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. THE GPT-2 MONOLITH (Rigid, Metallic, Indigo Core)
        const monolithGroup = new THREE.Group();
        
        // The Core Geometry
        const geoMonolith = new THREE.BoxGeometry(4, 12, 4);
        const matMonolith = new THREE.MeshStandardMaterial({
            color: 0x111111,
            metalness: 0.9,
            roughness: 0.2,
            emissive: 0x220055, // Deep Indigo Glow
            emissiveIntensity: 0.5,
            wireframe: false
        });
        const monolith = new THREE.Mesh(geoMonolith, matMonolith);
        monolithGroup.add(monolith);

        // Add "Data Wafers" (Wireframe overlay)
        const geoWire = new THREE.BoxGeometry(4.1, 12.1, 4.1);
        const matWire = new THREE.MeshBasicMaterial({ color: 0x4b0082, wireframe: true, transparent: true, opacity: 0.3 });
        const wireframe = new THREE.Mesh(geoWire, matWire);
        monolithGroup.add(wireframe);

        monolithGroup.position.set(-10, 0, 0);
        scene.add(monolithGroup);

        // 3. THE NEURO-CELLULAR UNIVERSE (Organic, Particle-based)
        const particleCount = 4000;
        const geometryParticles = new THREE.BufferGeometry();
        const positions = [];
        const colors = [];

        const color1 = new THREE.Color(0x00ffcc); // Teal
        const color2 = new THREE.Color(0xffaa00); // Gold (The transferred knowledge)

        for (let i = 0; i < particleCount; i++) {
            // Create a cloud shape
            const x = (Math.random() - 0.5) * 20 + 8; // Offset to right
            const y = (Math.random() - 0.5) * 15;
            const z = (Math.random() - 0.5) * 15;

            positions.push(x, y, z);

            // Mix colors based on proximity to Monolith
            // Closer to monolith = Gold, Farther = Teal
            const mixedColor = x < 5 ? color2 : color1;
            colors.push(mixedColor.r, mixedColor.g, mixedColor.b);
        }

        geometryParticles.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometryParticles.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const materialParticles = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometryParticles, materialParticles);
        scene.add(particleSystem);

        // 4. THE CONNECTION BEAM (Energy Transfer)
        const beamGeo = new THREE.CylinderGeometry(0.2, 2, 18, 32, 1, true);
        const beamMat = new THREE.MeshBasicMaterial({ 
            color: 0xffd700, // Liquid Gold
            transparent: true, 
            opacity: 0.4,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending
        });
        const beam = new THREE.Mesh(beamGeo, beamMat);
        beam.rotation.z = Math.PI / 2;
        beam.position.set(0, 0, 0); // Center between them
        scene.add(beam);

        // 5. LIGHTING
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0x4b0082, 2, 50); // Indigo light from Monolith
        pointLight.position.set(-10, 0, 2);
        scene.add(pointLight);

        const goldLight = new THREE.PointLight(0xffd700, 1, 40); // Gold light from transfer
        goldLight.position.set(5, 0, 0);
        scene.add(goldLight);

        // 6. ANIMATION LOOP
        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            // Rotate Monolith slowly (Rigid)
            monolithGroup.rotation.y += 0.002;

            // Pulse the Beam
            const scale = 1 + Math.sin(Date.now() * 0.005) * 0.1;
            beam.scale.set(1, 1, scale);

            // Animate Particles (Organic chaos)
            const positions = particleSystem.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                // Slight jitter to simulate "biological" movement
                positions[i * 3 + 1] += Math.sin(Date.now() * 0.001 + positions[i*3]) * 0.01;
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.rotation.y -= 0.001; // Entire cloud drift

            renderer.render(scene, camera);
        }

        animate();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
