stage: pretrain
data_glob: "datasets/organized/merged/merged_part_*.jsonl"
tokenizer_dir: "artifacts/tokenizer_32k"
output_dir: "artifacts/model_0p5b"

# model size (tweak as per VRAM/params goal)
n_layer: 24
n_head: 16
hidden_size: 1024
seq_len: 512

# training params
num_train_epochs: 2
batch_size: 4
grad_accum: 4
learning_rate: 5e-4
weight_decay: 0.01
warmup_ratio: 0.05
lr_scheduler_type: cosine
num_workers: 8

# logging/checkpointing
logging_steps: 50
eval_steps: 500
save_steps: 500
keep_last_n: 3
confmat_top_k: 10

# performance
fp16: true
bf16: false
gradient_checkpointing: true
deepspeed: null   # optionally supply path to deepspeed config
